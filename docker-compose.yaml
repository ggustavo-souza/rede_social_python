services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: always
    volumes:
      - ./client:/app
      - /app/node_modules
  
  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      - CHAVE_JWT="chaveAplicacaoRedeSOcialPythonTeste"
    restart: always
    volumes:
      - ./server:/app
    